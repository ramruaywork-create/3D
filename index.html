<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้าน 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed 3D stage, slim header bar, legend + view controls floating bottom */
:root {
  --bg: #EEF0F2; --panel: #FFFFFF; --fg: #1F2328; --muted: #5B636C;
  --line: #D3D8DE; --accent: #2F5D8A; --stage: #DDE2E7;
  --font: 'IBM Plex Sans Thai', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181C; --panel: #1E2227; --fg: #E8EBEE; --muted: #A2AAB3;
  --line: #333A42; --accent: #8DB6E0; --stage: #1A1E23; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15181C; --panel: #1E2227; --fg: #E8EBEE; --muted: #A2AAB3;
  --line: #333A42; --accent: #8DB6E0; --stage: #1A1E23; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { margin: 0; font-size: 18px; font-weight: 700; text-wrap: balance; }
header p { margin: 0; font-size: 13px; color: var(--muted); }
#stage { position: relative; flex: 1; min-height: 0; background: var(--stage); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.dock { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-end; pointer-events: none; }
.card { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, auto)); gap: 4px 14px; font-size: 12px; }
.legend span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 14px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); flex: none; }
.views { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; font-size: 13px; padding: 8px 12px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); right: 12px; font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { .legend { grid-template-columns: minmax(0, auto); } }
</style>

<style>body{margin:0}</style>
</head>
<body>
<header>
  <h1>ร้าน 3D</h1>
  <p id="sub"></p>
</header>
<div id="stage">
  <div class="hint">ลากเพื่อหมุน · หมุนล้อ/บีบนิ้วเพื่อซูม · คลิกขวาหรือสองนิ้วเพื่อเลื่อน</div>
  <div class="dock">
    <div class="card legend" id="legend"></div>
    <div class="card views">
      <button id="l-before" aria-pressed="false">ก่อน</button>
      <button id="l-after" aria-pressed="false">หลัง</button>
      <button id="l-after2" aria-pressed="false">หลัง 2</button>
      <button id="l-v4" aria-pressed="true">แบบ 4</button>
      <span style="width:1px;background:var(--line);margin:0 2px" aria-hidden="true"></span>
      <button id="v-iso" aria-pressed="true">มุมเฉียง</button>
      <button id="v-top" aria-pressed="false">มุมบน</button>
      <button id="v-front" aria-pressed="false">จากหน้าร้าน</button>
      <button id="v-walls" aria-pressed="true">ผนัง</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  // Plan units: 1 px = 2.5 cm (40 px = 1 m). x to the right, y toward the front glass.
  var C = {
    comp: [0xA27B3C, 'โต๊ะคอม'], util: [0xF2F2EE, 'โต๊ะวางของ'], high: [0xE9D54A, 'โต๊ะสูง'],
    acct: [0x9A9A9A, 'โต๊ะบัญชี'], red: [0xD8383B, 'ชั้นใส่สินค้า'], green: [0x2EAD5B, 'ชั้นสินค้าเล็ก'],
    black: [0x232323, 'ชั้นดำ'], blue: [0x3B53A4, 'ตู้เงินและเอกสาร'], door: [0xB5509E, 'ประตู'],
    glass: [0x96C8E1, 'กระจก']
  };
  var lg = document.getElementById('legend');
  ['comp','util','high','acct','red','green','black','blue','door','glass'].forEach(function (key) {
    var s = document.createElement('span'), i = document.createElement('i');
    i.style.background = '#' + C[key][0].toString(16).padStart(6, '0');
    s.appendChild(i); s.appendChild(document.createTextNode(C[key][1])); lg.appendChild(s);
  });
  if (!window.THREE || !THREE.OrbitControls) { document.querySelector('.hint').textContent = 'โหลดตัวแสดงผล 3D ไม่สำเร็จ ลองรีเฟรชหน้านี้'; return; }

  var stage = document.getElementById('stage');
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.insertBefore(renderer.domElement, stage.firstChild);
  var scene = new THREE.Scene();
  function stageColor() { return getComputedStyle(document.documentElement).getPropertyValue('--stage').trim() || '#DDE2E7'; }
  scene.background = new THREE.Color(stageColor());
  var camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9a9488, 0.85));
  var sun = new THREE.DirectionalLight(0xfff4e6, 0.7);
  sun.position.set(9, 18, 12); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0005;
  var sc = sun.shadow.camera; sc.left = -11; sc.right = 11; sc.top = 13; sc.bottom = -13;
  sun.target.position.set(4, 0, 5); scene.add(sun); scene.add(sun.target);

  // ---------- materials ----------
  var matCache = {};
  function mat(color, o) {
    o = o || {};
    var key = color + '|' + (o.r || 0.7) + '|' + (o.m || 0) + '|' + (o.op || 1);
    if (!matCache[key]) matCache[key] = new THREE.MeshStandardMaterial({ color: color, roughness: o.r == null ? 0.7 : o.r, metalness: o.m || 0, transparent: (o.op || 1) < 1, opacity: o.op || 1 });
    return matCache[key];
  }
  function tileTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 256; var g = c.getContext('2d');
    g.fillStyle = '#E9E4D8'; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = '#CFC8B8'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
    var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return t;
  }
  var GLASS = new THREE.MeshStandardMaterial({ color: 0xBFDDEB, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.28, depthWrite: false });
  var ALU = mat(0xB9BEC4, { r: 0.35, m: 0.8 }), WALL = mat(0xEEEBE4, { r: 0.9 }), CONC = mat(0x8E9095, { r: 0.85 });
  var WOOD = mat(0x8A6A48, { r: 0.6 }), DARK = mat(0x2A2C30, { r: 0.5 }), SCREEN = mat(0x101317, { r: 0.25, m: 0.3 });
  var FABRIC = mat(0x3A3F47, { r: 0.9 }), CHROME = mat(0xC9CDD2, { r: 0.25, m: 0.9 });

  var wallGroup = new THREE.Group(); scene.add(wallGroup);
  var world = new THREE.Group(); scene.add(world);

  // box by world centre/size (metres)
  function box(parent, cx, cy, cz, sx, sy, sz, m, shadow) {
    var mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m);
    mesh.position.set(cx, cy, cz);
    mesh.castShadow = shadow !== false; mesh.receiveShadow = true;
    parent.add(mesh); return mesh;
  }
  function cyl(parent, cx, cy, cz, r, h, m) {
    var mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 18), m);
    mesh.position.set(cx, cy, cz); mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh;
  }
  // plan-px rectangle -> world box
  function pbox(parent, x0, y0, x1, y1, z0, h, m, shadow) {
    return box(parent, (x0 + x1) / 80, z0 + h / 2, (y0 + y1) / 80, (x1 - x0) / 40, h, (y1 - y0) / 40, m, shadow);
  }

  // ---------- seeded random for products ----------
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  var productPalette = [0xF2EDE3, 0xD9C7A5, 0xC8A27A, 0xE6E6E6, 0x7FA7C9, 0xE9B44C, 0xBFD7B5, 0xD98C6A, 0x9E9EAE, 0xF4D6C6];
  var products = []; // {x,y,z,sx,sy,sz,color}

  // ---------- shelving unit ----------
  // x0..x1, y0..y1 in plan px; h metres; levels count; frame colour; doubleSided: products both faces
  function shelf(x0, y0, x1, y1, h, levels, frameColor, opts) {
    opts = opts || {};
    var X0 = x0 / 40, X1 = x1 / 40, Z0 = y0 / 40, Z1 = y1 / 40;
    var w = X1 - X0, d = Z1 - Z0, cx = (X0 + X1) / 2, cz = (Z0 + Z1) / 2;
    var alongX = w >= d, L = alongX ? w : d, D = alongX ? d : w;
    var g = new THREE.Group(); world.add(g);
    var frame = mat(frameColor, { r: 0.45, m: 0.35 });
    var board = mat(opts.board || 0xF1F1EE, { r: 0.6 });
    var post = 0.035;
    function P(a, b) { return alongX ? [cx + a, cz + b] : [cx + b, cz + a]; } // a along length, b across depth
    function S(a, b) { return alongX ? [a, b] : [b, a]; }
    [-1, 1].forEach(function (sa) { [-1, 1].forEach(function (sb) {
      var p = P(sa * (L / 2 - post / 2 - 0.01), sb * (D / 2 - post / 2 - 0.01));
      box(g, p[0], h / 2, p[1], post, h, post, frame);
    }); });
    // centre back panel (gondola) or rear panel
    var bp = P(0, opts.backSide ? opts.backSide * (D / 2 - 0.02) : 0), bs = S(L - 0.04, 0.015);
    box(g, bp[0], h / 2 + 0.03, bp[1], bs[0], h - 0.06, bs[1], frame);
    // kick plate
    var kp = S(L - 0.02, D - 0.02); box(g, cx, 0.05, cz, kp[0], 0.1, kp[1], frame);
    // levels + products
    for (var i = 0; i < levels; i++) {
      var y = 0.1 + i * (h - 0.16) / (levels - 1);
      var bsz = S(L - 0.02, D - 0.02);
      box(g, cx, y + 0.01, cz, bsz[0], 0.02, bsz[1], board);
      if (i === levels - 1) continue;
      var gapH = (h - 0.16) / (levels - 1) - 0.04;
      var sides = opts.backSide ? [-opts.backSide] : [-1, 1];
      sides.forEach(function (sd) {
        var depth = (opts.backSide ? D - 0.06 : D / 2 - 0.04) * 0.92;
        var centreB = opts.backSide ? -opts.backSide * 0.0 : sd * (D / 4);
        if (opts.backSide) centreB = 0 - opts.backSide * 0.01;
        var a = -L / 2 + 0.06;
        while (a < L / 2 - 0.12) {
          var pw = 0.12 + rnd() * 0.22; if (a + pw > L / 2 - 0.05) pw = L / 2 - 0.05 - a;
          if (pw < 0.06) break;
          if (rnd() > 0.12) {
            var ph = Math.min(gapH * (0.45 + rnd() * 0.45), 0.45), pd = depth * (0.7 + rnd() * 0.3);
            var pc = P(a + pw / 2, centreB), ps = S(pw - 0.015, pd);
            products.push({ x: pc[0], y: y + 0.02 + ph / 2, z: pc[1], sx: ps[0], sy: ph, sz: ps[1], c: opts.bins ? [0x55585E, 0x6E7178, 0x3E4146][Math.floor(rnd() * 3)] : productPalette[Math.floor(rnd() * productPalette.length)] });
          }
          a += pw;
        }
      });
    }
  }

  // ---------- desk with monitor + chair ----------
  // sit: direction the person sits from the desk: 'x+','x-','z+','z-'
  function desk(x0, y0, x1, y1, topColor, sit, opts) {
    opts = opts || {};
    var X0 = x0 / 40, X1 = x1 / 40, Z0 = y0 / 40, Z1 = y1 / 40, h = opts.h || 0.75;
    var cx = (X0 + X1) / 2, cz = (Z0 + Z1) / 2, w = X1 - X0, d = Z1 - Z0;
    var g = new THREE.Group(); world.add(g);
    var top = mat(topColor, { r: 0.55 });
    box(g, cx, h - 0.015, cz, w, 0.03, d, top);
    var legM = opts.legs || DARK, li = 0.04;
    [[X0 + li, Z0 + li], [X1 - li, Z0 + li], [X0 + li, Z1 - li], [X1 - li, Z1 - li]].forEach(function (p) { box(g, p[0], (h - 0.03) / 2, p[1], 0.04, h - 0.03, 0.04, legM); });
    if (opts.modesty !== false && sit) {
      // modesty panel on the far side
      var axisX = sit[0] === 'x', sgn = sit[1] === '+' ? 1 : -1;
      if (axisX) box(g, cx - sgn * (w / 2 - 0.05), h / 2, cz, 0.02, h * 0.55, d - 0.1, top);
      else box(g, cx, h / 2, cz - sgn * (d / 2 - 0.05), w - 0.1, h * 0.55, 0.02, top);
    }
    if (!sit) return g;
    var ax = sit[0] === 'x', s = sit[1] === '+' ? 1 : -1;
    var half = ax ? w / 2 : d / 2;
    function at(alongSit, across) { return ax ? [cx + s * alongSit, cz + across] : [cx + across, cz + s * alongSit]; }
    function sz(alongSit, across) { return ax ? [alongSit, across] : [across, alongSit]; }
    if (opts.monitor !== false) {
      var mp = at(-(half - 0.14), 0), ms = sz(0.03, 0.56);
      box(g, mp[0], h + 0.38, mp[1], ms[0], 0.34, ms[1], SCREEN);
      var np = at(-(half - 0.16), 0); box(g, np[0], h + 0.1, np[1], 0.04, 0.18, 0.04, DARK);
      var fs = sz(0.16, 0.22); box(g, np[0], h + 0.008, np[1], fs[0], 0.016, fs[1], DARK);
      var kb = at(-(half - 0.36), 0), ks = sz(0.15, 0.44); box(g, kb[0], h + 0.012, kb[1], ks[0], 0.02, ks[1], mat(0xE4E6E8));
    }
    if (opts.register) {
      var rp = at(-(half - 0.2), -0.25); box(g, rp[0], h + 0.08, rp[1], 0.28, 0.16, 0.28, mat(0x2E3136, { r: 0.4 }));
    }
    if (opts.chair !== false) chair(g, at(half + 0.28, 0), ax ? (s > 0 ? -Math.PI / 2 : Math.PI / 2) : (s > 0 ? Math.PI : 0));
    return g;
  }
  // office chair facing rotY (0 = facing +z, backrest on -z)
  function chair(parent, p, rotY) {
    var g = new THREE.Group(); g.position.set(p[0], 0, p[1]); g.rotation.y = rotY; parent.add(g);
    box(g, 0, 0.47, 0, 0.46, 0.07, 0.44, FABRIC);
    box(g, 0, 0.78, -0.22, 0.44, 0.5, 0.05, FABRIC);
    cyl(g, 0, 0.24, 0, 0.025, 0.42, CHROME);
    for (var i = 0; i < 5; i++) {
      var a = i * Math.PI * 2 / 5, leg = box(g, Math.sin(a) * 0.15, 0.04, Math.cos(a) * 0.15, 0.04, 0.03, 0.3, DARK);
      leg.rotation.y = a;
    }
  }
  function stool(parent, x, z) {
    var g = new THREE.Group(); g.position.set(x, 0, z); parent.add(g);
    cyl(g, 0, 0.74, 0, 0.17, 0.05, mat(0x3B3B3B, { r: 0.6 }));
    cyl(g, 0, 0.37, 0, 0.022, 0.72, CHROME);
    cyl(g, 0, 0.012, 0, 0.2, 0.025, CHROME);
    var ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.01, 6, 24), CHROME); ring.rotation.x = Math.PI / 2; ring.position.y = 0.3; g.add(ring);
  }
  function cartonsOn(x0, y0, x1, y1, h, n) {
    for (var i = 0; i < n; i++) {
      var sx = 0.25 + rnd() * 0.2, sz = 0.2 + rnd() * 0.15, sy = 0.15 + rnd() * 0.2;
      var x = x0 / 40 + sx / 2 + 0.05 + rnd() * Math.max(0.01, (x1 - x0) / 40 - sx - 0.1);
      var z = y0 / 40 + sz / 2 + 0.05 + rnd() * Math.max(0.01, (y1 - y0) / 40 - sz - 0.1);
      products.push({ x: x, y: h + sy / 2, z: z, sx: sx, sy: sy, sz: sz, c: 0xC9A27A });
    }
  }
  function door(parent, x0, y0, x1, y1, h, color, glass) {
    var g = new THREE.Group(); parent.add(g);
    var X0 = x0 / 40, X1 = x1 / 40, Z0 = y0 / 40, Z1 = y1 / 40, alongX = (X1 - X0) >= (Z1 - Z0);
    var cx = (X0 + X1) / 2, cz = (Z0 + Z1) / 2, L = alongX ? X1 - X0 : Z1 - Z0, t = 0.04;
    if (glass) {
      // two glass leaves with aluminium frames
      [-1, 1].forEach(function (sd) {
        var lc = sd * L / 4, lw = L / 2 - 0.01;
        var p = alongX ? [cx + lc, cz] : [cx, cz + lc];
        var fr = function (a, y, aw, hh) { return alongX ? box(g, p[0] + a, y, p[1], aw, hh, t, ALU) : box(g, p[0], y, p[1] + a, t, hh, aw, ALU); };
        fr(-lw / 2 + 0.025, h / 2, 0.05, h); fr(lw / 2 - 0.025, h / 2, 0.05, h);
        fr(0, h - 0.04, lw, 0.08); fr(0, 0.06, lw, 0.12);
        var gm = alongX ? box(g, p[0], h / 2, p[1], lw - 0.1, h - 0.2, 0.01, GLASS, false) : box(g, p[0], h / 2, p[1], 0.01, h - 0.2, lw - 0.1, GLASS, false);
        var hp = -sd * (lw / 2 - 0.08);
        if (alongX) box(g, p[0] + hp, 1.05, p[1], 0.03, 0.5, 0.09, CHROME); else box(g, p[0], 1.05, p[1] + hp, 0.09, 0.5, 0.03, CHROME);
      });
    } else {
      var dm = mat(color, { r: 0.55 });
      if (alongX) box(g, cx, h / 2, cz, L - 0.04, h, t, dm); else box(g, cx, h / 2, cz, t, h, L - 0.04, dm);
      var hx = alongX ? [cx + L / 2 - 0.12, cz] : [cx, cz + L / 2 - 0.12];
      box(g, hx[0], 1.0, hx[1], alongX ? 0.12 : 0.07, 0.025, alongX ? 0.07 : 0.12, CHROME);
    }
  }

  // ---------- building ----------
  var H = 3.0;
  var floorTex = tileTexture(); floorTex.repeat.set(332 / 40 / 0.6, 452 / 40 / 0.6);
  var floor = pbox(world, -6, 34, 326, 486, -0.05, 0.05, new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55 }), false);
  var rTex = tileTexture(); rTex.repeat.set(108 / 40 / 0.6, 126 / 40 / 0.6);
  pbox(world, -6, -92, 102, 34, -0.05, 0.05, new THREE.MeshStandardMaterial({ map: rTex, roughness: 0.55 }), false);
  pbox(world, 102, -8, 326, 34, -0.05, 0.05, mat(0xCFCBC2, { r: 0.9 }), false); // back area outside the wall
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.12 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(4, -0.051, 5); ground.receiveShadow = true; scene.add(ground);

  var W = wallGroup;
  pbox(W, -6, 34, 0, 480, 0, H, WALL); pbox(W, 320, 34, 326, 480, 0, H, WALL);
  // glass partition: pane + aluminium rails + mullions about every metre
  function glassWall(x0, y0, x1, y1, z0, h) {
    var alongX = (x1 - x0) >= (y1 - y0), L = alongX ? x1 - x0 : y1 - y0, n = Math.max(1, Math.round(L / 40));
    var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    if (alongX) pbox(W, x0, my - 0.5, x1, my + 0.5, z0, h, GLASS, false); else pbox(W, mx - 0.5, y0, mx + 0.5, y1, z0, h, GLASS, false);
    if (alongX) { pbox(W, x0, my - 2, x1, my + 2, z0, 0.08, ALU); pbox(W, x0, my - 2, x1, my + 2, z0 + h - 0.05, 0.05, ALU); }
    else { pbox(W, mx - 2, y0, mx + 2, y1, z0, 0.08, ALU); pbox(W, mx - 2, y0, mx + 2, y1, z0 + h - 0.05, 0.05, ALU); }

      var zone = new THREE.Mesh(new THREE.PlaneGeometry(80 / 40, 58 / 40), new THREE.MeshBasicMaterial({ color: 0x2EAD5B, transparent: true, opacity: 0.16, depthWrite: false }));
      zone.rotation.x = -Math.PI / 2; zone.position.set(76 / 40, 0.004, 433 / 40); world.add(zone);
      label('พื้นที่โล่งหน้าร้าน', 76 / 40, 0.6, 433 / 40, 1.8);
      var zone2 = zone.clone(); zone2.scale.set(40 / 80, 1, 1); zone2.position.set(208 / 40, 0.004, 433 / 40); world.add(zone2);
      label('แคชเชียร์', 254 / 40, 1.9, 438 / 40, 1.3);
      label('ฝั่งผู้สูงอายุ', 250 / 40, 3.3, 300 / 40, 2.2);
      label('ฝั่งพนักงาน', 70 / 40, 3.3, 160 / 40, 2.0);
    }

    var im = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.75 }), products.length);
    var m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color();
    products.forEach(function (p, i) {
      m4.compose(new THREE.Vector3(p.x, p.y, p.z), q, new THREE.Vector3(p.sx, p.sy, p.sz));
      im.setMatrixAt(i, m4); im.setColorAt(i, col.setHex(p.c));
    });
    im.castShadow = true; im.receiveShadow = true; world.add(im);
    world = root;
    return grp;
  }
  var layouts = { before: buildVariant('before'), after: buildVariant('after'), after2: buildVariant('after2'), v4: buildVariant('v4') };
  var subs = {
    before: 'ก่อน · โถง 8 × 12 ม. + ห้องทำงานกระจก 2.4 × 3 ม.',
    after: 'หลัง · แยกฝั่งพนักงาน (ซ้าย · ประตู 1) กับฝั่งผู้สูงอายุ (ขวา · ประตู 2) · ชั้นแดงครบ 20 · ทางเดิน ~0.9–1 ม.',
    after2: 'หลัง 2 · แบบก่อน เอาโต๊ะสูงหน้ากระจก 4 ตัวและชั้นเขียวกลางทางเดิน 2 ชุดออก · ถอยแถวแดงชิดกันไปด้านหลัง · โต๊ะบัญชี (ไม่มีคอม) มุมหน้าขวา',
    v4: 'แบบ 4 · แบบห้าง ชั้นอยู่ริมและเป็นซอยสั้นจากผนังขวา ทางเดินลูกค้ากลาง 1 ม. หน้าร้านโล่ง · QC หน้าร้านฝั่งพนักงาน · โต๊ะบัญชี (ไม่มีคอม) มุมหน้าขวา'
  };
  function showLayout(n) {
    ['before', 'after', 'after2', 'v4'].forEach(function (k) {
      layouts[k].visible = k === n;
      document.getElementById('l-' + k).setAttribute('aria-pressed', k === n ? 'true' : 'false');
    });
    document.getElementById('sub').textContent = subs[n];
  }
  ['before', 'after', 'after2', 'v4'].forEach(function (k) { document.getElementById('l-' + k).addEventListener('click', function () { showLayout(k); }); });
  showLayout('v4');

  // ---------- views ----------
  var center = new THREE.Vector3(4, 0, 4.9);
  var views = {
    iso: [new THREE.Vector3(14, 12, 18), center.clone()],
    top: [new THREE.Vector3(4, 22, 5.3), center.clone()],
    front: [new THREE.Vector3(5.2, 1.6, 15.2), new THREE.Vector3(4, 1.0, 5)]
  };
  function setView(name) {
    camera.position.copy(views[name][0]); controls.target.copy(views[name][1]); controls.update();
    ['iso', 'top', 'front'].forEach(function (n) { document.getElementById('v-' + n).setAttribute('aria-pressed', n === name ? 'true' : 'false'); });
  }
  ['iso', 'top', 'front'].forEach(function (n) { document.getElementById('v-' + n).addEventListener('click', function () { setView(n); }); });
  document.getElementById('v-walls').addEventListener('click', function () {
    wallGroup.visible = !wallGroup.visible; this.setAttribute('aria-pressed', wallGroup.visible ? 'true' : 'false');
  });
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1);
    var narrow = w < 560; views.iso[0].set(narrow ? 18 : 14, narrow ? 18 : 12, narrow ? 24 : 18);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  function syncBg() { scene.background = new THREE.Color(stageColor()); }
  if (window.matchMedia) { var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', syncBg); }
  new MutationObserver(syncBg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  resize(); setView('iso');
  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
})();
